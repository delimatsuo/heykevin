# Deploys staging automatically. Production deploys are manual releases from main.

name: Deploy

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Release operation'
        required: true
        type: choice
        options: [staging, staging-audit, staging-prepare, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT_ID: kevin-491315
  GCP_REGION: us-central1
  STAGING_SERVICE: kevin-api-staging
  STAGING_URL: https://kevin-api-staging-l63rergg7a-uc.a.run.app
  PRODUCTION_SERVICE: kevin-api
  PRODUCTION_URL: https://kevin-api-752910912062.us-central1.run.app

jobs:
  test:
    name: Test
    # F-18: only run the test job on PRs from this repo, not from forks. A
    # forked PR can otherwise spend our runner minutes and exfiltrate any
    # secrets the test job touches (currently none, so this is defence in
    # depth). Push and workflow_dispatch are always allowed.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  prepare-staging-message-delivery:
    name: Audit or Prepare Staging Message Delivery
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Required for staging Workload Identity Federation.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/enterprise-voice-integration' && (inputs.target == 'staging-audit' || inputs.target == 'staging-prepare') }}
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Authenticate to staging GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_STAGING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Refuse non-staging control-plane targets
        env:
          STAGING_FIRESTORE_PROJECT_ID: ${{ vars.FIRESTORE_PROJECT_ID }}
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/enterprise-voice-integration" || exit 1
          test "$STAGING_SERVICE" = "kevin-api-staging" || exit 1
          test "$STAGING_FIRESTORE_PROJECT_ID" = "kevin-staging-491315" || exit 1

      - name: Audit or prepare staging controls
        env:
          RELEASE_OPERATION: ${{ inputs.target }}
          STAGING_ALERT_NOTIFICATION_CHANNELS: ${{ vars.STAGING_ALERT_NOTIFICATION_CHANNELS }}
        run: |
          case "$RELEASE_OPERATION" in
            staging-audit) mode=audit ;;
            staging-prepare) mode=apply ;;
            *) exit 1 ;;
          esac
          python3 scripts/manage_staging_message_delivery.py "$mode"

      - name: Health check after staging preparation
        if: inputs.target == 'staging-prepare'
        run: |
          SERVICE_JSON=$(gcloud run services describe "$STAGING_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          jq -e '
            .status.latestReadyRevisionName as $latest
            | ([.status.traffic[]?
                | select(.revisionName == $latest)
                | (.percent // 0)] | add // 0) == 100
          ' <<<"$SERVICE_JSON" >/dev/null
          STAGING_HEALTH_URL=$(jq -r '.status.url' <<<"$SERVICE_JSON")
          HEALTH=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 20 --retry 3 --retry-all-errors \
            "$STAGING_HEALTH_URL/health")
          jq -e --arg service "$STAGING_SERVICE" '
            .status == "ok"
            and .environment == "staging"
            and .service == $service
            and (.revision | type == "string" and length > 0)
            and (.deploy_sha | type == "string" and length == 40)
          ' <<<"$HEALTH" >/dev/null

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for staging Workload Identity Federation.
    if: ${{ github.ref == 'refs/heads/staging' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')) }}
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_STAGING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check staging isolation variables
        run: |
          test -n "${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }}" || (echo "Missing staging STAGING_RUNTIME_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }}" || (echo "Missing staging STAGING_BUILD_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ vars.FIRESTORE_PROJECT_ID }}" || (echo "Missing staging FIRESTORE_PROJECT_ID" && exit 1)
          test "${{ vars.FIRESTORE_PROJECT_ID }}" != "$GCP_PROJECT_ID" || (echo "Staging must not use production Firestore project" && exit 1)
          test -n "${{ vars.FIREBASE_DATABASE_URL }}" || (echo "Missing staging FIREBASE_DATABASE_URL" && exit 1)
          case "${{ vars.FIREBASE_DATABASE_URL }}" in
            *kevin-491315-rtdb*) echo "Staging must not use production RTDB" && exit 1 ;;
          esac
          test -n "${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }}" || (echo "Missing staging PRODUCTION_TWILIO_ACCOUNT_SID" && exit 1)

      - name: Verify background worker runtime
        run: bash scripts/verify_cloud_run_worker_runtime.sh "$STAGING_SERVICE" "$GCP_PROJECT_ID" "$GCP_REGION"

      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy $STAGING_SERVICE \
            --source . \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --service-account ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }} \
            --build-service-account ${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }} \
            --update-env-vars ENVIRONMENT=staging,APPSTORE_ENVIRONMENT=sandbox,CLOUD_RUN_URL=$STAGING_URL,FIRESTORE_PROJECT_ID=${{ vars.FIRESTORE_PROJECT_ID }},FIREBASE_DATABASE_URL=${{ vars.FIREBASE_DATABASE_URL }},APNS_SANDBOX=${{ vars.APNS_SANDBOX || 'false' }},PRODUCTION_TWILIO_ACCOUNT_SID=${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }},DEPLOY_SHA=$GITHUB_SHA \
            --tag staging

      - name: Health check
        run: |
          sleep 15
          STAGING_URL=$(gcloud run services describe $STAGING_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format='value(status.url)')
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || echo "000")
          echo "Staging health: HTTP $STATUS at $STAGING_URL"
          [ "$STATUS" = "200" ] || exit 1

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for production Workload Identity Federation.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Refuse non-main production deploy
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Production deploys must run from main" && exit 1)

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PRODUCTION_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check production runtime variables
        run: |
          test -n "${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }}" || (echo "Missing production PRODUCTION_RUNTIME_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }}" || (echo "Missing production PRODUCTION_BUILD_SERVICE_ACCOUNT" && exit 1)

      - name: Verify background worker runtime
        run: bash scripts/verify_cloud_run_worker_runtime.sh "$PRODUCTION_SERVICE" "$GCP_PROJECT_ID" "$GCP_REGION"

      - name: Deploy to Cloud Run (Production)
        run: |
          gcloud run deploy $PRODUCTION_SERVICE \
            --source . \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --service-account ${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }} \
            --build-service-account ${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }} \
            --update-env-vars ENVIRONMENT=production,APPSTORE_ENVIRONMENT=production,CLOUD_RUN_URL=$PRODUCTION_URL,FIRESTORE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_URL=https://kevin-491315-rtdb.firebaseio.com,APNS_SANDBOX=false,PRODUCTION_TWILIO_ACCOUNT_SID=${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }},DEPLOY_SHA=$GITHUB_SHA

      - name: Health check
        run: |
          sleep 15
          PROD_URL=$(gcloud run services describe $PRODUCTION_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format='value(status.url)')
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$PROD_URL/health" || echo "000")
          echo "Production health: HTTP $STATUS at $PROD_URL"
          [ "$STATUS" = "200" ] || exit 1
