# Deploys staging automatically. Production deploys are manual releases from main.

name: Deploy

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [staging, production]
      candidate_sha:
        description: 'Exact 40-character remote branch-head SHA (staging only)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GCP_PROJECT_ID: kevin-491315
  GCP_REGION: us-central1
  STAGING_SERVICE: kevin-api-staging
  STAGING_URL: https://kevin-api-staging-l63rergg7a-uc.a.run.app
  PRODUCTION_SERVICE: kevin-api
  PRODUCTION_URL: https://kevin-api-752910912062.us-central1.run.app
  CLOUD_BUILD_IGNORE_POLICY: |-
    **
    !Dockerfile
    !pyproject.toml
    !.dockerignore
    !app/
    !app/**
    gha-creds-*.json
    **/gha-creds-*.json
    **/.env
    **/.env.*
    **/*.p8
    **/*.pem
    **/*.key
    **/*.p12
    **/__pycache__/**
    **/*.pyc
    **/*.pyo

jobs:
  test_suites:
    name: Python suite ${{ matrix.shard }}/7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && inputs.candidate_sha) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact checked-out HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && inputs.candidate_sha) || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Expected SHA must be an exact lowercase 40-character SHA" && exit 1)
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || (echo "Checked-out SHA does not match expected SHA" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          SHARD_FILE="$(mktemp)"
          trap 'rm -f "$SHARD_FILE"' EXIT
          python scripts/partition_tests.py --shard "$TEST_SHARD" --total-shards 7 > "$SHARD_FILE"
          test -s "$SHARD_FILE" || (echo "Test shard $TEST_SHARD partition produced no test files" && exit 1)
          mapfile -t test_files < "$SHARD_FILE"
          test "${#test_files[@]}" -gt 0 || (echo "Test shard $TEST_SHARD array is empty" && exit 1)
          for f in "${test_files[@]}"; do
            test -n "$f" || (echo "Empty test file entry in shard $TEST_SHARD" && exit 1)
          done
          python -m pytest --tb=short -q -- "${test_files[@]}"

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && inputs.candidate_sha) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact checked-out HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && inputs.candidate_sha) || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Expected SHA must be an exact lowercase 40-character SHA" && exit 1)
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || (echo "Checked-out SHA does not match expected SHA" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint fatal Ruff selectors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile Python bytecode
        run: python -m compileall -q .

      - name: Check git diff whitespace and conflicts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          DISPATCH_CANDIDATE_SHA: ${{ (inputs.target == 'staging' && inputs.candidate_sha) || github.sha }}
        run: |
          set -euo pipefail
          EMPTY_TREE_SHA="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid PR base SHA: $PR_BASE_SHA" && exit 1)
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid PR head SHA: $PR_HEAD_SHA" && exit 1)
            git cat-file -e "$PR_BASE_SHA^{commit}" || (echo "PR base commit unavailable: $PR_BASE_SHA" && exit 1)
            git cat-file -e "$PR_HEAD_SHA^{commit}" || (echo "PR head commit unavailable: $PR_HEAD_SHA" && exit 1)
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            [[ "$PUSH_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid push head SHA: $PUSH_HEAD_SHA" && exit 1)
            git cat-file -e "$PUSH_HEAD_SHA^{commit}" || (echo "Push head commit unavailable: $PUSH_HEAD_SHA" && exit 1)
            if [ -z "$PUSH_BEFORE_SHA" ] || [[ "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
              git diff --check "$EMPTY_TREE_SHA" "$PUSH_HEAD_SHA"
            else
              [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid push before SHA: $PUSH_BEFORE_SHA" && exit 1)
              git cat-file -e "$PUSH_BEFORE_SHA^{commit}" || (echo "Push before commit unavailable: $PUSH_BEFORE_SHA" && exit 1)
              git diff --check "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$DISPATCH_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Invalid candidate SHA: $DISPATCH_CANDIDATE_SHA" && exit 1)
            git cat-file -e "$DISPATCH_CANDIDATE_SHA^{commit}" || (echo "Candidate commit unavailable: $DISPATCH_CANDIDATE_SHA" && exit 1)
            if git rev-parse --verify "${DISPATCH_CANDIDATE_SHA}~1^{commit}" >/dev/null 2>&1; then
              git diff --check "${DISPATCH_CANDIDATE_SHA}~1" "$DISPATCH_CANDIDATE_SHA"
            else
              git diff --check "$EMPTY_TREE_SHA" "$DISPATCH_CANDIDATE_SHA"
            fi
          else
            echo "Unsupported event for diff check: $EVENT_NAME" && exit 1
          fi

  test:
    name: Test
    needs: [test_suites, quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate test and quality results
        env:
          SUITES_RESULT: ${{ needs.test_suites.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          echo "test_suites result: $SUITES_RESULT"
          echo "quality result: $QUALITY_RESULT"
          if [ "$SUITES_RESULT" = "success" ] && [ "$QUALITY_RESULT" = "success" ]; then
            echo "All test suites and quality checks passed successfully."
            exit 0
          else
            echo "Gate failed: test_suites=$SUITES_RESULT quality=$QUALITY_RESULT"
            exit 1
          fi

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/main' && inputs.candidate_sha != '') }}
    environment: staging
    env:
      STAGING_RUNTIME_SERVICE_ACCOUNT: ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }}
      STAGING_BUILD_SERVICE_ACCOUNT: ${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }}
      FIRESTORE_PROJECT_ID: ${{ vars.FIRESTORE_PROJECT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      APNS_SANDBOX: ${{ vars.APNS_SANDBOX }}
      PRODUCTION_TWILIO_ACCOUNT_SID: ${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact staging candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "candidate_sha must be an exact lowercase 40-character SHA" && exit 1)
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$CANDIDATE_SHA" || (echo "Checked-out SHA does not match candidate_sha" && exit 1)
          git ls-remote --heads origin | awk '{print $1}' | grep -Fxq "$CANDIDATE_SHA" || (echo "candidate_sha must be the current head of a remote branch" && exit 1)

      - name: Check staging isolation variables
        run: |
          test -n "$STAGING_RUNTIME_SERVICE_ACCOUNT" || (echo "Missing staging STAGING_RUNTIME_SERVICE_ACCOUNT" && exit 1)
          test -n "$STAGING_BUILD_SERVICE_ACCOUNT" || (echo "Missing staging STAGING_BUILD_SERVICE_ACCOUNT" && exit 1)
          test -n "$FIRESTORE_PROJECT_ID" || (echo "Missing staging FIRESTORE_PROJECT_ID" && exit 1)
          test "$FIRESTORE_PROJECT_ID" != "$GCP_PROJECT_ID" || (echo "Staging must not use production Firestore project" && exit 1)
          test -n "$FIREBASE_DATABASE_URL" || (echo "Missing staging FIREBASE_DATABASE_URL" && exit 1)
          case "$FIREBASE_DATABASE_URL" in
            *kevin-491315-rtdb*) echo "Staging must not use production RTDB" && exit 1 ;;
          esac
          test "$APNS_SANDBOX" = "true" || (echo "Staging APNS_SANDBOX must be true" && exit 1)
          test -n "$PRODUCTION_TWILIO_ACCOUNT_SID" || (echo "Missing staging PRODUCTION_TWILIO_ACCOUNT_SID" && exit 1)

      - name: Write trusted Cloud Build source policy
        run: printf '%s\n' "$CLOUD_BUILD_IGNORE_POLICY" > .gcloudignore

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_STAGING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to Cloud Run (Staging)
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          gcloud run deploy "$STAGING_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --service-account "$STAGING_RUNTIME_SERVICE_ACCOUNT" \
            --build-service-account "$STAGING_BUILD_SERVICE_ACCOUNT" \
            --remove-secrets RECEPTIONIST_OBSERVATION_SHADOW_CALLER_HMAC_KEY \
            --update-env-vars "ENVIRONMENT=staging,APPSTORE_ENVIRONMENT=sandbox,CLOUD_RUN_URL=$STAGING_URL,FIRESTORE_PROJECT_ID=$FIRESTORE_PROJECT_ID,FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL,APNS_SANDBOX=$APNS_SANDBOX,PRODUCTION_TWILIO_ACCOUNT_SID=$PRODUCTION_TWILIO_ACCOUNT_SID,SUBSCRIPTION_PROMOTIONAL_OFFERS_ENABLED=false,RECEPTIONIST_OBSERVATION_SHADOW_ENABLED=false,DEPLOY_SHA=$DEPLOY_SHA" \
            --tag staging \
            --no-traffic

      - name: Health check
        run: |
          sleep 15
          STAGING_TRAFFIC=$(gcloud run services describe "$STAGING_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='json(status.traffic)')
          STAGING_TAG_URL=$(python -c 'import json,sys; traffic=json.load(sys.stdin).get("status", {}).get("traffic", []); tagged_urls=[entry.get("url", "") for entry in traffic if entry.get("tag") == "staging"]; print(tagged_urls[0] if len(tagged_urls) == 1 else "")' <<< "$STAGING_TRAFFIC")
          STAGING_TAG_REVISION=$(python -c 'import json,sys; traffic=json.load(sys.stdin).get("status", {}).get("traffic", []); tagged_revisions=[entry.get("revisionName", "") for entry in traffic if entry.get("tag") == "staging"]; print(tagged_revisions[0] if len(tagged_revisions) == 1 else "")' <<< "$STAGING_TRAFFIC")
          test -n "$STAGING_TAG_URL" || (echo "Missing tagged staging revision URL" && exit 1)
          test -n "$STAGING_TAG_REVISION" || (echo "Missing tagged staging revision" && exit 1)
          CANDIDATE_HEALTH_JSON=$(curl -sf \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 5 \
            --max-time 30 \
            "$STAGING_TAG_URL/health")
          CANDIDATE_SHA=$(python -c 'import json,sys; print(json.load(sys.stdin).get("deploy_sha", ""))' <<< "$CANDIDATE_HEALTH_JSON")
          # DEPLOY_SHA is exported to GITHUB_ENV by the deployment step.
          # shellcheck disable=SC2153
          test "$CANDIDATE_SHA" = "$DEPLOY_SHA" || (echo "Tagged staging candidate deploy SHA mismatch" && exit 1)
          gcloud run services update-traffic "$STAGING_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions="${STAGING_TAG_REVISION}=100"
          STAGING_URL=$(gcloud run services describe "$STAGING_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')
          HEALTH_JSON=$(curl -sf \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 5 \
            --max-time 30 \
            "$STAGING_URL/health")
          DEPLOYED_SHA=$(python -c 'import json,sys; print(json.load(sys.stdin).get("deploy_sha", ""))' <<< "$HEALTH_JSON")
          # shellcheck disable=SC2153
          test "$DEPLOYED_SHA" = "$DEPLOY_SHA" || (echo "Staging traffic deploy SHA mismatch" && exit 1)
          echo "Staging health verified for deploy SHA $DEPLOY_SHA"

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    environment: production
    env:
      PRODUCTION_RUNTIME_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }}
      PRODUCTION_BUILD_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }}
      PRODUCTION_TWILIO_ACCOUNT_SID: ${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Refuse non-main production deploy
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Production deploys must run from main" && exit 1)
          test -z "$CANDIDATE_SHA" || (echo "Production does not accept candidate_sha" && exit 1)

      - name: Check production runtime variables
        run: |
          test -n "$PRODUCTION_RUNTIME_SERVICE_ACCOUNT" || (echo "Missing production PRODUCTION_RUNTIME_SERVICE_ACCOUNT" && exit 1)
          test -n "$PRODUCTION_BUILD_SERVICE_ACCOUNT" || (echo "Missing production PRODUCTION_BUILD_SERVICE_ACCOUNT" && exit 1)
          test -n "$PRODUCTION_TWILIO_ACCOUNT_SID" || (echo "Missing production PRODUCTION_TWILIO_ACCOUNT_SID" && exit 1)
          test -n "$TWILIO_MESSAGING_SERVICE_SID" || (echo "Missing production TWILIO_MESSAGING_SERVICE_SID" && exit 1)

      - name: Write trusted Cloud Build source policy
        run: printf '%s\n' "$CLOUD_BUILD_IGNORE_POLICY" > .gcloudignore

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PRODUCTION_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to Cloud Run (Production)
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          gcloud run deploy "$PRODUCTION_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --service-account "$PRODUCTION_RUNTIME_SERVICE_ACCOUNT" \
            --build-service-account "$PRODUCTION_BUILD_SERVICE_ACCOUNT" \
            --remove-secrets RECEPTIONIST_OBSERVATION_SHADOW_CALLER_HMAC_KEY \
            --update-env-vars "ENVIRONMENT=production,APPSTORE_ENVIRONMENT=production,CLOUD_RUN_URL=$PRODUCTION_URL,FIRESTORE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_URL=https://kevin-491315-rtdb.firebaseio.com,APNS_SANDBOX=false,PRODUCTION_TWILIO_ACCOUNT_SID=$PRODUCTION_TWILIO_ACCOUNT_SID,TWILIO_MESSAGING_SERVICE_SID=$TWILIO_MESSAGING_SERVICE_SID,SUBSCRIPTION_PROMOTIONAL_OFFERS_ENABLED=false,RECEPTIONIST_OBSERVATION_SHADOW_ENABLED=false,DEPLOY_SHA=$DEPLOY_SHA"

      - name: Health check
        run: |
          sleep 15
          PROD_URL=$(gcloud run services describe "$PRODUCTION_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')
          HEALTH_JSON=$(curl -sf \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 5 \
            --max-time 30 \
            "$PROD_URL/health")
          DEPLOYED_SHA=$(python -c 'import json,sys; print(json.load(sys.stdin).get("deploy_sha", ""))' <<< "$HEALTH_JSON")
          # DEPLOY_SHA is exported to GITHUB_ENV by the deployment step.
          # shellcheck disable=SC2153
          test "$DEPLOYED_SHA" = "$DEPLOY_SHA" || (echo "Production health deploy SHA mismatch" && exit 1)
          echo "Production health verified for deploy SHA $DEPLOY_SHA"
