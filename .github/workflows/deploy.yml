# Deploys staging automatically. Production deploys are manual releases from main.

name: Deploy

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: kevin-491315
  GCP_REGION: us-central1
  STAGING_SERVICE: kevin-api-staging
  STAGING_URL: https://kevin-api-staging-l63rergg7a-uc.a.run.app
  PRODUCTION_SERVICE: kevin-api
  PRODUCTION_URL: https://kevin-api-752910912062.us-central1.run.app

jobs:
  test:
    name: Test
    # F-18: only run the test job on PRs from this repo, not from forks. A
    # forked PR can otherwise spend our runner minutes and exfiltrate any
    # secrets the test job touches (currently none, so this is defence in
    # depth). Push and workflow_dispatch are always allowed.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Install qualification runtime
        run: python -m pip install "uv==0.11.7"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev --python 3.12.13

      - name: Capture qualification environment before tests
        run: >-
          uv run --locked --no-sync --extra dev --python 3.12.13
          python scripts/verify_qualification_environment.py --phase before

      - name: Run tests
        run: uv run --locked --no-sync --extra dev --python 3.12.13 python -m pytest --tb=short -q

      - name: Run qualification static checks
        run: |
          uv run --locked --no-sync --extra dev --python 3.12.13 \
            ruff check app/services/caller_turn_alignment.py \
            app/services/caller_turn_measurement.py \
            app/services/caller_turn_qualification.py \
            app/services/qualification_allocation.py \
            app/services/qualification_environment.py \
            app/services/qualification_identity.py \
            app/services/qualification_ledger.py \
            app/services/qualification_privacy.py \
            app/services/qualification_private_paths.py \
            app/services/voice_turn_replay.py \
            scripts/evaluate_gemini_caller_turn_qualification.py \
            scripts/run_gemini_caller_turn_qualification.py \
            scripts/verify_qualification_environment.py \
            tests/unit/test_caller_turn_alignment.py \
            tests/unit/test_caller_turn_measurement.py \
            tests/unit/test_caller_turn_qualification.py \
            tests/unit/test_evaluate_gemini_caller_turn_qualification.py \
            tests/unit/test_gate0b_offline_boundaries.py \
            tests/unit/test_qualification_allocation.py \
            tests/unit/test_qualification_environment.py \
            tests/unit/test_qualification_identity.py \
            tests/unit/test_qualification_ledger.py \
            tests/unit/test_qualification_privacy.py \
            tests/unit/test_qualification_private_paths.py \
            tests/unit/test_run_gemini_caller_turn_qualification.py \
            tests/unit/test_voice_turn_replay.py
          uv run --locked --no-sync --extra dev --python 3.12.13 \
            bandit -q -lll app/services/qualification_identity.py \
            app/services/qualification_ledger.py \
            app/services/caller_turn_measurement.py \
            scripts/run_gemini_caller_turn_qualification.py \
            scripts/evaluate_gemini_caller_turn_qualification.py
          uv run --locked --no-sync --extra dev --python 3.12.13 \
            python -m compileall -q app/services scripts

      - name: Verify qualification environment after tests
        run: >-
          uv run --locked --no-sync --extra dev --python 3.12.13
          python scripts/verify_qualification_environment.py --phase after

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/staging' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')) }}
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_STAGING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check staging isolation variables
        run: |
          test -n "${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }}" || (echo "Missing staging STAGING_RUNTIME_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }}" || (echo "Missing staging STAGING_BUILD_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ vars.FIRESTORE_PROJECT_ID }}" || (echo "Missing staging FIRESTORE_PROJECT_ID" && exit 1)
          test "${{ vars.FIRESTORE_PROJECT_ID }}" != "$GCP_PROJECT_ID" || (echo "Staging must not use production Firestore project" && exit 1)
          test -n "${{ vars.FIREBASE_DATABASE_URL }}" || (echo "Missing staging FIREBASE_DATABASE_URL" && exit 1)
          case "${{ vars.FIREBASE_DATABASE_URL }}" in
            *kevin-491315-rtdb*) echo "Staging must not use production RTDB" && exit 1 ;;
          esac
          test -n "${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }}" || (echo "Missing staging PRODUCTION_TWILIO_ACCOUNT_SID" && exit 1)

      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy $STAGING_SERVICE \
            --source . \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --service-account ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }} \
            --build-service-account ${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }} \
            --update-env-vars ENVIRONMENT=staging,APPSTORE_ENVIRONMENT=sandbox,CLOUD_RUN_URL=$STAGING_URL,FIRESTORE_PROJECT_ID=${{ vars.FIRESTORE_PROJECT_ID }},FIREBASE_DATABASE_URL=${{ vars.FIREBASE_DATABASE_URL }},APNS_SANDBOX=${{ vars.APNS_SANDBOX || 'false' }},PRODUCTION_TWILIO_ACCOUNT_SID=${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }},DEPLOY_SHA=$GITHUB_SHA \
            --tag staging

      - name: Health check
        run: |
          sleep 15
          STAGING_URL=$(gcloud run services describe $STAGING_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format='value(status.url)')
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || echo "000")
          echo "Staging health: HTTP $STATUS at $STAGING_URL"
          [ "$STATUS" = "200" ] || exit 1

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Refuse non-main production deploy
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Production deploys must run from main" && exit 1)

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PRODUCTION_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check production runtime variables
        run: |
          test -n "${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }}" || (echo "Missing production PRODUCTION_RUNTIME_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }}" || (echo "Missing production PRODUCTION_BUILD_SERVICE_ACCOUNT" && exit 1)

      - name: Deploy to Cloud Run (Production)
        run: |
          gcloud run deploy $PRODUCTION_SERVICE \
            --source . \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --service-account ${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }} \
            --build-service-account ${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }} \
            --update-env-vars ENVIRONMENT=production,APPSTORE_ENVIRONMENT=production,CLOUD_RUN_URL=$PRODUCTION_URL,FIRESTORE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_URL=https://kevin-491315-rtdb.firebaseio.com,APNS_SANDBOX=false,PRODUCTION_TWILIO_ACCOUNT_SID=${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }},DEPLOY_SHA=$GITHUB_SHA

      - name: Health check
        run: |
          sleep 15
          PROD_URL=$(gcloud run services describe $PRODUCTION_SERVICE \
            --project $GCP_PROJECT_ID \
            --region $GCP_REGION \
            --format='value(status.url)')
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$PROD_URL/health" || echo "000")
          echo "Production health: HTTP $STATUS at $PROD_URL"
          [ "$STATUS" = "200" ] || exit 1
