# Manual Cloud Run rollback with environment-bound target validation and proof.

name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options: [staging, production]
      method:
        description: 'Rollback method'
        required: true
        type: choice
        options: [traffic-split, redeploy-tag]
      revision_or_tag:
        description: 'Exact environment revision or release tag'
        required: true
        type: string
      confirm_production:
        description: 'For production rollbacks, type production'
        required: false
        type: string

permissions:
  contents: read

env:
  GCP_PROJECT_ID: kevin-491315
  GCP_REGION: us-central1

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }} via ${{ inputs.method }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Validate rollback request
        env:
          ROLLBACK_ENVIRONMENT: ${{ inputs.environment }}
          ROLLBACK_METHOD: ${{ inputs.method }}
          ROLLBACK_TARGET: ${{ inputs.revision_or_tag }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          python3 scripts/validate_rollback_target.py \
            --environment "$ROLLBACK_ENVIRONMENT" \
            --method "$ROLLBACK_METHOD" \
            --target "$ROLLBACK_TARGET" \
            --production-confirmation "$PRODUCTION_CONFIRMATION" \
            --github-env "$GITHUB_ENV"
          CANDIDATE_TAG="rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$CANDIDATE_TAG" =~ ^rollback-[0-9]+-[0-9]+$ ]]
          printf 'CANDIDATE_TAG=%s\n' "$CANDIDATE_TAG" >> "$GITHUB_ENV"

      - name: Validate staging control identities
        if: inputs.environment == 'staging'
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_STAGING_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          [[ "$WIF_PROVIDER" =~ ^projects/752910912062/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          [[ "$WIF_SERVICE_ACCOUNT" == "github-actions-staging@kevin-491315.iam.gserviceaccount.com" ]]
          [[ "$RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z0-9-]+@kevin-491315\.iam\.gserviceaccount\.com$ ]]
          printf 'EXPECTED_RUNTIME_SERVICE_ACCOUNT=%s\n' \
            "$RUNTIME_SERVICE_ACCOUNT" >> "$GITHUB_ENV"

      - name: Validate production control identities
        if: inputs.environment == 'production'
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_PRODUCTION_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          [[ "$WIF_PROVIDER" =~ ^projects/752910912062/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          [[ "$WIF_SERVICE_ACCOUNT" =~ ^github-actions-(prod|production)@kevin-491315\.iam\.gserviceaccount\.com$ ]]
          [[ "$RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z0-9-]+@kevin-491315\.iam\.gserviceaccount\.com$ ]]
          printf 'EXPECTED_RUNTIME_SERVICE_ACCOUNT=%s\n' \
            "$RUNTIME_SERVICE_ACCOUNT" >> "$GITHUB_ENV"

      - name: Authenticate to staging GCP
        id: auth_staging
        if: inputs.environment == 'staging'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_STAGING_SERVICE_ACCOUNT }}

      - name: Authenticate to production GCP
        id: auth_production
        if: inputs.environment == 'production'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PRODUCTION_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Capture current serving state
        run: |
          SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          PREVIOUS_TRAFFIC=$(jq -er --arg service "$SERVICE" '
            [.status.traffic[]?
              | select((.percent // 0) > 0)
              | {revision: .revisionName, percent: .percent}]
            | if length > 0
                and (map(.percent) | add) == 100
                and all(.[];
                  (.revision | type == "string" and startswith($service + "-"))
                  and (.percent | type == "number" and floor == . and . > 0 and . <= 100))
              then sort_by(.revision)
                | map("\(.revision)=\(.percent | tostring)%")
                | join(",")
              else error("invalid serving traffic")
              end
          ' <<<"$SERVICE_JSON")
          [[ "$PREVIOUS_TRAFFIC" =~ ^[a-z0-9,=%-]+$ ]]

          PREVIOUS_PROVENANCE=""
          while IFS= read -r revision; do
            [[ "$revision" =~ ^[a-z0-9-]+$ ]]
            REVISION_JSON=$(gcloud run revisions describe "$revision" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format=json)
            deploy_sha=$(jq -r '
              [.spec.containers[0].env[]?
                | select(.name == "DEPLOY_SHA")
                | .value]
              | unique
              | if length == 1 and (.[0] | test("^[0-9a-f]{40}$"))
                then .[0]
                else "unavailable"
                end
            ' <<<"$REVISION_JSON")
            if [[ -n "$PREVIOUS_PROVENANCE" ]]; then
              PREVIOUS_PROVENANCE+=","
            fi
            PREVIOUS_PROVENANCE+="$revision=$deploy_sha"
          done < <(jq -er '
            [.status.traffic[]?
              | select((.percent // 0) > 0)
              | .revisionName]
            | unique
            | .[]
          ' <<<"$SERVICE_JSON")
          [[ "$PREVIOUS_PROVENANCE" =~ ^[a-z0-9,=-]+$ ]]
          printf 'PREVIOUS_TRAFFIC=%s\n' "$PREVIOUS_TRAFFIC" >> "$GITHUB_ENV"
          printf 'PREVIOUS_PROVENANCE=%s\n' "$PREVIOUS_PROVENANCE" >> "$GITHUB_ENV"

      - name: Validate rollback revision
        if: inputs.method == 'traffic-split'
        run: |
          REVISION_JSON=$(gcloud run revisions describe "$ROLLBACK_TARGET" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          jq -e --arg service "$SERVICE" '
            .metadata.labels["serving.knative.dev/service"] == $service
            and ([.status.conditions[]?
              | select(.type == "Ready" and .status == "True")]
              | length) == 1
          ' <<<"$REVISION_JSON" >/dev/null
          TARGET_DEPLOY_SHA=$(jq -er '
            [.spec.containers[0].env[]?
              | select(.name == "DEPLOY_SHA")
              | .value]
            | unique
            | if length == 1 and (.[0] | test("^[0-9a-f]{40}$"))
              then .[0]
              else error("missing deploy SHA")
              end
          ' <<<"$REVISION_JSON")
          if [[ "$ROLLBACK_ENVIRONMENT" == "production" ]]; then
            git cat-file -e "$TARGET_DEPLOY_SHA^{commit}"
            git merge-base --is-ancestor "$TARGET_DEPLOY_SHA" origin/main
          fi
          printf 'TARGET_REVISION=%s\n' "$ROLLBACK_TARGET" >> "$GITHUB_ENV"
          printf 'TARGET_DEPLOY_SHA=%s\n' "$TARGET_DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Validate rollback tag
        if: inputs.method == 'redeploy-tag'
        run: |
          git check-ref-format "refs/tags/$ROLLBACK_TARGET"
          git show-ref --verify --quiet "refs/tags/$ROLLBACK_TARGET"
          ROLLBACK_COMMIT=$(git rev-parse --verify "refs/tags/$ROLLBACK_TARGET^{commit}")
          [[ "$ROLLBACK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$ROLLBACK_COMMIT" origin/main
          git checkout --detach "$ROLLBACK_COMMIT"
          printf 'ROLLBACK_COMMIT=%s\n' "$ROLLBACK_COMMIT" >> "$GITHUB_ENV"
          printf 'TARGET_DEPLOY_SHA=%s\n' "$ROLLBACK_COMMIT" >> "$GITHUB_ENV"

      - name: Validate redeploy environment boundary
        if: inputs.method == 'redeploy-tag'
        env:
          STAGING_BUILD_SERVICE_ACCOUNT: ${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }}
          PRODUCTION_BUILD_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }}
        run: |
          SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          env_value() {
            jq -er --arg name "$1" '
              .spec.template.spec.containers[0].env[]
              | select(.name == $name)
              | .value
            ' <<<"$SERVICE_JSON"
          }
          CURRENT_ENVIRONMENT=$(env_value ENVIRONMENT)
          CURRENT_APPSTORE_ENVIRONMENT=$(env_value APPSTORE_ENVIRONMENT)
          CURRENT_FIRESTORE_PROJECT=$(env_value FIRESTORE_PROJECT_ID)
          CURRENT_FIREBASE_URL=$(env_value FIREBASE_DATABASE_URL)
          CURRENT_RUNTIME_SERVICE_ACCOUNT=$(jq -er \
            '.spec.template.spec.serviceAccountName' <<<"$SERVICE_JSON")
          [[ "$CURRENT_RUNTIME_SERVICE_ACCOUNT" == "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" ]]
          if [[ "$ROLLBACK_ENVIRONMENT" == "staging" ]]; then
            [[ "$CURRENT_ENVIRONMENT" == "staging" ]]
            [[ "$CURRENT_APPSTORE_ENVIRONMENT" == "sandbox" ]]
            [[ "$CURRENT_FIRESTORE_PROJECT" == "kevin-staging-491315" ]]
            [[ "$CURRENT_FIREBASE_URL" == "https://kevin-staging-491315-rtdb.firebaseio.com" ]]
            BUILD_SERVICE_ACCOUNT="$STAGING_BUILD_SERVICE_ACCOUNT"
          else
            [[ "$CURRENT_ENVIRONMENT" == "production" ]]
            [[ "$CURRENT_APPSTORE_ENVIRONMENT" == "production" ]]
            [[ "$CURRENT_FIRESTORE_PROJECT" == "$GCP_PROJECT_ID" ]]
            [[ "$CURRENT_FIREBASE_URL" == "https://kevin-491315-rtdb.firebaseio.com" ]]
            BUILD_SERVICE_ACCOUNT="$PRODUCTION_BUILD_SERVICE_ACCOUNT"
          fi
          [[ "$BUILD_SERVICE_ACCOUNT" =~ ^projects/kevin-491315/serviceAccounts/[a-z0-9-]+@kevin-491315\.iam\.gserviceaccount\.com$ ]]
          printf 'BUILD_SERVICE_ACCOUNT=%s\n' "$BUILD_SERVICE_ACCOUNT" >> "$GITHUB_ENV"

      - name: Attach candidate tag to rollback revision
        if: inputs.method == 'traffic-split'
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --update-tags="$CANDIDATE_TAG=$ROLLBACK_TARGET"

      - name: Deploy rollback candidate from release tag
        if: inputs.method == 'redeploy-tag'
        run: |
          deploy_args=(
            --source .
            --project "$GCP_PROJECT_ID"
            --region "$GCP_REGION"
            --allow-unauthenticated
            --service-account "$EXPECTED_RUNTIME_SERVICE_ACCOUNT"
            --build-service-account "$BUILD_SERVICE_ACCOUNT"
            --update-env-vars "DEPLOY_SHA=$ROLLBACK_COMMIT"
            --no-traffic
            --tag "$CANDIDATE_TAG"
          )
          gcloud run deploy "$SERVICE" "${deploy_args[@]}"
          SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          TARGET_REVISION=$(jq -er --arg tag "$CANDIDATE_TAG" '
            [.status.traffic[]?
              | select(.tag == $tag)
              | .revisionName]
            | unique
            | if length == 1 then .[0] else error("candidate revision unavailable") end
          ' <<<"$SERVICE_JSON")
          if [[ "$ROLLBACK_ENVIRONMENT" == "staging" ]]; then
            [[ "$TARGET_REVISION" =~ ^kevin-api-staging-[0-9]{5}-[a-z0-9]{3}$ ]]
          else
            [[ "$TARGET_REVISION" =~ ^kevin-api-[0-9]{5}-[a-z0-9]{3}$ ]]
          fi
          printf 'TARGET_REVISION=%s\n' "$TARGET_REVISION" >> "$GITHUB_ENV"

      - name: Verify rollback candidate before traffic change
        run: |
          REVISION_JSON=$(gcloud run revisions describe "$TARGET_REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          jq -e \
            --arg service "$SERVICE" \
            --arg runtime_service_account "$EXPECTED_RUNTIME_SERVICE_ACCOUNT" \
            --arg sha "$TARGET_DEPLOY_SHA" '
              .metadata.labels["serving.knative.dev/service"] == $service
              and .spec.serviceAccountName == $runtime_service_account
              and ([.status.conditions[]?
                | select(.type == "Ready" and .status == "True")]
                | length) == 1
              and ([.spec.containers[0].env[]?
                | select(.name == "DEPLOY_SHA")
                | .value]
                | unique) == [$sha]
            ' <<<"$REVISION_JSON" >/dev/null
          revision_env() {
            jq -er --arg name "$1" '
              [.spec.containers[0].env[]?
                | select(.name == $name)
                | .value]
              | unique
              | if length == 1 then .[0] else error("invalid environment boundary") end
            ' <<<"$REVISION_JSON"
          }
          TARGET_ENVIRONMENT=$(revision_env ENVIRONMENT)
          TARGET_APPSTORE_ENVIRONMENT=$(revision_env APPSTORE_ENVIRONMENT)
          TARGET_FIRESTORE_PROJECT=$(revision_env FIRESTORE_PROJECT_ID)
          TARGET_FIREBASE_URL=$(revision_env FIREBASE_DATABASE_URL)
          if [[ "$ROLLBACK_ENVIRONMENT" == "staging" ]]; then
            [[ "$TARGET_ENVIRONMENT" == "staging" ]]
            [[ "$TARGET_APPSTORE_ENVIRONMENT" == "sandbox" ]]
            [[ "$TARGET_FIRESTORE_PROJECT" == "kevin-staging-491315" ]]
            [[ "$TARGET_FIREBASE_URL" == "https://kevin-staging-491315-rtdb.firebaseio.com" ]]
          else
            [[ "$TARGET_ENVIRONMENT" == "production" ]]
            [[ "$TARGET_APPSTORE_ENVIRONMENT" == "production" ]]
            [[ "$TARGET_FIRESTORE_PROJECT" == "$GCP_PROJECT_ID" ]]
            [[ "$TARGET_FIREBASE_URL" == "https://kevin-491315-rtdb.firebaseio.com" ]]
          fi

          SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          CANDIDATE_URL=$(jq -er \
            --arg tag "$CANDIDATE_TAG" \
            --arg revision "$TARGET_REVISION" '
              [.status.traffic[]?
                | select(.tag == $tag and .revisionName == $revision)
                | .url]
              | unique
              | if length == 1 then .[0] else error("candidate URL unavailable") end
            ' <<<"$SERVICE_JSON")
          [[ "$CANDIDATE_URL" =~ ^https://[a-z0-9.-]+\.run\.app$ ]]
          VERIFIED=false
          HEALTH_FILTER="
            .status == \"ok\"
            and .environment == \$environment
            and .service == \$service
            and .revision == \$revision
            and .deploy_sha == \$sha
          "
          for _ in $(seq 1 12); do
            if HEALTH=$(curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 20 "$CANDIDATE_URL/health") \
              && jq -e \
                --arg environment "$ROLLBACK_ENVIRONMENT" \
                --arg service "$SERVICE" \
                --arg revision "$TARGET_REVISION" \
                --arg sha "$TARGET_DEPLOY_SHA" \
                "$HEALTH_FILTER" <<<"$HEALTH" >/dev/null; then
              VERIFIED=true
              break
            fi
            sleep 5
          done
          [[ "$VERIFIED" == "true" ]]

      - name: Route traffic to verified rollback candidate
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions="$TARGET_REVISION=100"

      - name: Verify serving revision after rollback
        run: |
          SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          TRAFFIC_FILTER="
            ([.status.traffic[]?
              | select(.revisionName == \$revision)
              | (.percent // 0)]
              | add // 0) == 100
          "
          jq -e \
            --arg revision "$TARGET_REVISION" \
            "$TRAFFIC_FILTER" <<<"$SERVICE_JSON" >/dev/null
          SERVICE_URL=$(jq -er '.status.url' <<<"$SERVICE_JSON")
          VERIFIED=false
          HEALTH_FILTER="
            .status == \"ok\"
            and .environment == \$environment
            and .service == \$service
            and .revision == \$revision
            and .deploy_sha == \$sha
          "
          for _ in $(seq 1 12); do
            if HEALTH=$(curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 20 "$SERVICE_URL/health") \
              && jq -e \
                --arg environment "$ROLLBACK_ENVIRONMENT" \
                --arg service "$SERVICE" \
                --arg revision "$TARGET_REVISION" \
                --arg sha "$TARGET_DEPLOY_SHA" \
                "$HEALTH_FILTER" <<<"$HEALTH" >/dev/null; then
              VERIFIED=true
              break
            fi
            sleep 5
          done
          [[ "$VERIFIED" == "true" ]]
          {
            printf "### Rollback verified\n"
            printf -- "- Environment: \`%s\`\n" "$ROLLBACK_ENVIRONMENT"
            printf -- "- Method: \`%s\`\n" "$ROLLBACK_METHOD"
            printf -- "- Previous traffic: \`%s\`\n" "$PREVIOUS_TRAFFIC"
            printf -- "- Previous deploy SHAs: \`%s\`\n" "$PREVIOUS_PROVENANCE"
            printf -- "- Serving revision: \`%s\`\n" "$TARGET_REVISION"
            printf -- "- Serving deploy SHA: \`%s\`\n" "$TARGET_DEPLOY_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary candidate tag
        if: ${{ always() && (steps.auth_staging.outcome == 'success' || steps.auth_production.outcome == 'success') }}
        run: |
          SERVICE_JSON=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)
          if jq -e --arg tag "$CANDIDATE_TAG" '
              any(.status.traffic[]?; .tag == $tag)
            ' <<<"$SERVICE_JSON" >/dev/null; then
            gcloud run services update-traffic "$SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --remove-tags="$CANDIDATE_TAG"
          fi
