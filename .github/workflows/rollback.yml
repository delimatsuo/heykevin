# Manual rollback workflow for Cloud Run traffic splitting or revision revert.

name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options: [staging, production]
      method:
        description: 'Rollback method'
        required: true
        type: choice
        options: [traffic-split, redeploy-tag]
      revision_or_tag:
        description: 'Cloud Run revision (e.g. kevin-api-00150-abc) or git tag (e.g. staging-2026-04-08-pre-abc1234)'
        required: true
        type: string
      confirm_production:
        description: 'For production rollbacks, type production'
        required: false
        type: string

permissions:
  contents: read

env:
  GCP_PROJECT_ID: kevin-491315
  GCP_REGION: us-central1
  CLOUD_BUILD_IGNORE_POLICY: |-
    **
    !Dockerfile
    !pyproject.toml
    !.dockerignore
    !app/
    !app/**
    gha-creds-*.json
    **/gha-creds-*.json
    **/.env
    **/.env.*
    **/*.p8
    **/*.pem
    **/*.key
    **/*.p12
    **/__pycache__/**
    **/*.pyc
    **/*.pyo

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }} via ${{ inputs.method }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ROLLBACK_ENVIRONMENT: ${{ inputs.environment }}
      ROLLBACK_METHOD: ${{ inputs.method }}
      REVISION_OR_TAG: ${{ inputs.revision_or_tag }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      STAGING_RUNTIME_SERVICE_ACCOUNT: ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }}
      STAGING_BUILD_SERVICE_ACCOUNT: ${{ vars.STAGING_BUILD_SERVICE_ACCOUNT }}
      FIRESTORE_PROJECT_ID: ${{ vars.FIRESTORE_PROJECT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      APNS_SANDBOX: ${{ vars.APNS_SANDBOX }}
      PRODUCTION_TWILIO_ACCOUNT_SID: ${{ vars.PRODUCTION_TWILIO_ACCOUNT_SID }}
      PRODUCTION_RUNTIME_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_RUNTIME_SERVICE_ACCOUNT }}
      PRODUCTION_BUILD_SERVICE_ACCOUNT: ${{ vars.PRODUCTION_BUILD_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Confirm production rollback
        if: inputs.environment == 'production'
        run: |
          test "$CONFIRM_PRODUCTION" = "production" || (echo "Type production in confirm_production to rollback production" && exit 1)

      - name: Validate rollback target
        run: |
          if [ "$ROLLBACK_METHOD" = "traffic-split" ]; then
            if [ "$ROLLBACK_ENVIRONMENT" = "staging" ]; then
              [[ "$REVISION_OR_TAG" =~ ^kevin-api-staging-[0-9]+-[a-z0-9]+$ ]] || (echo "Invalid staging revision" && exit 1)
            else
              [[ "$REVISION_OR_TAG" =~ ^kevin-api-[0-9]+-[a-z0-9]+$ ]] || (echo "Invalid production revision" && exit 1)
            fi
          else
            git check-ref-format "refs/tags/$REVISION_OR_TAG" >/dev/null || (echo "Invalid rollback tag" && exit 1)
            LOCAL_TAG_OBJECT_SHA="$(git rev-parse --verify "refs/tags/$REVISION_OR_TAG")" || (echo "Rollback tag is not present locally" && exit 1)
            REMOTE_TAG_OBJECT_SHA="$(git ls-remote --exit-code --refs --tags origin "refs/tags/$REVISION_OR_TAG" | awk 'NR == 1 {print $1}')" || (echo "Rollback tag is not present on origin" && exit 1)
            test -n "$REMOTE_TAG_OBJECT_SHA" || (echo "Rollback tag is not present on origin" && exit 1)
            test "$LOCAL_TAG_OBJECT_SHA" = "$REMOTE_TAG_OBJECT_SHA" || (echo "Local rollback tag does not match origin" && exit 1)
            ROLLBACK_COMMIT_SHA="$(git rev-parse --verify "refs/tags/$REVISION_OR_TAG^{commit}")" || (echo "Rollback tag must resolve to a commit" && exit 1)
            [[ "$ROLLBACK_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "Rollback tag did not resolve to an exact commit SHA" && exit 1)
            if [ "$ROLLBACK_ENVIRONMENT" = "production" ]; then
              case "$REVISION_OR_TAG" in
                prod-*) ;;
                *) echo "Production redeploy tags must start with prod-" && exit 1 ;;
              esac
              git merge-base --is-ancestor "$ROLLBACK_COMMIT_SHA" "origin/main" || (echo "Production rollback commit must be on main" && exit 1)
            fi
            echo "ROLLBACK_COMMIT_SHA=$ROLLBACK_COMMIT_SHA" >> "$GITHUB_ENV"
            if [ "$ROLLBACK_ENVIRONMENT" = "staging" ]; then
              test -n "$STAGING_RUNTIME_SERVICE_ACCOUNT" || (echo "Missing staging STAGING_RUNTIME_SERVICE_ACCOUNT" && exit 1)
              test -n "$STAGING_BUILD_SERVICE_ACCOUNT" || (echo "Missing staging STAGING_BUILD_SERVICE_ACCOUNT" && exit 1)
              test -n "$FIRESTORE_PROJECT_ID" || (echo "Missing staging FIRESTORE_PROJECT_ID" && exit 1)
              test "$FIRESTORE_PROJECT_ID" != "$GCP_PROJECT_ID" || (echo "Staging must not use production Firestore project" && exit 1)
              test -n "$FIREBASE_DATABASE_URL" || (echo "Missing staging FIREBASE_DATABASE_URL" && exit 1)
              case "$FIREBASE_DATABASE_URL" in
                *kevin-491315-rtdb*) echo "Staging must not use production RTDB" && exit 1 ;;
              esac
              test "$APNS_SANDBOX" = "true" || (echo "Staging APNS_SANDBOX must be true" && exit 1)
              test -n "$PRODUCTION_TWILIO_ACCOUNT_SID" || (echo "Missing staging PRODUCTION_TWILIO_ACCOUNT_SID" && exit 1)
            else
              test -n "$PRODUCTION_RUNTIME_SERVICE_ACCOUNT" || (echo "Missing production PRODUCTION_RUNTIME_SERVICE_ACCOUNT" && exit 1)
              test -n "$PRODUCTION_BUILD_SERVICE_ACCOUNT" || (echo "Missing production PRODUCTION_BUILD_SERVICE_ACCOUNT" && exit 1)
              test -n "$PRODUCTION_TWILIO_ACCOUNT_SID" || (echo "Missing production PRODUCTION_TWILIO_ACCOUNT_SID" && exit 1)
            fi
          fi

      - name: Write trusted Cloud Build source policy
        if: inputs.method == 'redeploy-tag'
        run: printf '%s\n' "$CLOUD_BUILD_IGNORE_POLICY" > "$RUNNER_TEMP/kevin-release.gcloudignore"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ inputs.environment == 'production' && vars.WIF_PRODUCTION_SERVICE_ACCOUNT || vars.WIF_STAGING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set service name
        run: |
          if [ "$ROLLBACK_ENVIRONMENT" = "staging" ]; then
            echo "SERVICE=kevin-api-staging" >> "$GITHUB_ENV"
          else
            echo "SERVICE=kevin-api" >> "$GITHUB_ENV"
          fi

      - name: Rollback via traffic split
        if: inputs.method == 'traffic-split'
        run: |
          echo "Rolling back $SERVICE to revision: $REVISION_OR_TAG"
          gcloud run services update-traffic "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions="${REVISION_OR_TAG}=100"

      - name: Rollback via git tag redeploy
        if: inputs.method == 'redeploy-tag'
        run: |
          echo "Redeploying from git tag: $REVISION_OR_TAG"
          git checkout --detach "$ROLLBACK_COMMIT_SHA"
          DEPLOY_SHA="$(git rev-parse HEAD)"
          test "$DEPLOY_SHA" = "$ROLLBACK_COMMIT_SHA" || (echo "Checked-out rollback commit mismatch" && exit 1)
          echo "EXPECTED_DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          if [ "$ROLLBACK_ENVIRONMENT" = "staging" ]; then
            RUNTIME_SERVICE_ACCOUNT="$STAGING_RUNTIME_SERVICE_ACCOUNT"
            BUILD_SERVICE_ACCOUNT="$STAGING_BUILD_SERVICE_ACCOUNT"
            ENV_VARS="ENVIRONMENT=staging,APPSTORE_ENVIRONMENT=sandbox,CLOUD_RUN_URL=https://kevin-api-staging-l63rergg7a-uc.a.run.app,FIRESTORE_PROJECT_ID=$FIRESTORE_PROJECT_ID,FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL,APNS_SANDBOX=$APNS_SANDBOX,PRODUCTION_TWILIO_ACCOUNT_SID=$PRODUCTION_TWILIO_ACCOUNT_SID,DEPLOY_SHA=$DEPLOY_SHA"
          else
            RUNTIME_SERVICE_ACCOUNT="$PRODUCTION_RUNTIME_SERVICE_ACCOUNT"
            BUILD_SERVICE_ACCOUNT="$PRODUCTION_BUILD_SERVICE_ACCOUNT"
            ENV_VARS="ENVIRONMENT=production,APPSTORE_ENVIRONMENT=production,CLOUD_RUN_URL=https://kevin-api-752910912062.us-central1.run.app,FIRESTORE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_URL=https://kevin-491315-rtdb.firebaseio.com,APNS_SANDBOX=false,PRODUCTION_TWILIO_ACCOUNT_SID=$PRODUCTION_TWILIO_ACCOUNT_SID,DEPLOY_SHA=$DEPLOY_SHA"
          fi
          gcloud run deploy "$SERVICE" \
            --source . \
            --ignore-file "$RUNNER_TEMP/kevin-release.gcloudignore" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --build-service-account "$BUILD_SERVICE_ACCOUNT" \
            --update-env-vars "$ENV_VARS"

      - name: Health check after rollback
        run: |
          sleep 15
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')
          HEALTH_JSON=$(curl -sf \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 5 \
            --max-time 30 \
            "$URL/health")
          if [ "$ROLLBACK_METHOD" = "traffic-split" ]; then
            DEPLOYED_REVISION=$(python -c 'import json,sys; print(json.load(sys.stdin).get("revision", ""))' <<< "$HEALTH_JSON")
            test "$DEPLOYED_REVISION" = "$REVISION_OR_TAG" || (echo "Rollback revision mismatch" && exit 1)
          else
            DEPLOYED_SHA=$(python -c 'import json,sys; print(json.load(sys.stdin).get("deploy_sha", ""))' <<< "$HEALTH_JSON")
            test "$DEPLOYED_SHA" = "$EXPECTED_DEPLOY_SHA" || (echo "Rollback deploy SHA mismatch" && exit 1)
          fi
          echo "Post-rollback health verified at $URL"
