# Pre-commit hooks for Hey Kevin.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files

repos:
  # Gitleaks — block commits that contain secrets / credentials.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        description: Scans staged content for API keys, tokens, and PEM blocks.

  # Standard hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: check-merge-conflict
