<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin AI Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div id="auth-overlay" class="auth-overlay">
    <form id="auth-box" class="auth-box">
      <h1>Kevin AI Admin</h1>
      <p>Enter admin token</p>
      <input id="auth-input" type="password" placeholder="Bearer token" autocomplete="off">
      <button id="auth-btn" type="submit">Unlock</button>
      <div id="auth-error" class="auth-error" role="alert"></div>
    </form>
  </div>

  <header class="topbar">
    <div>
      <h1>Kevin <span>Admin</span></h1>
      <p id="last-updated">Never updated</p>
    </div>
    <div class="topbar-actions">
      <span id="refresh-dot" class="refresh-dot"></span>
      <button id="manual-refresh-btn" class="button button-secondary" type="button">Refresh</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Admin sections">
    <button class="tab is-active" type="button" data-tab="command">Command</button>
    <button class="tab" type="button" data-tab="contractors">Contractors</button>
    <button class="tab" type="button" data-tab="calls">Calls</button>
    <button class="tab" type="button" data-tab="numbers">Numbers</button>
    <button class="tab" type="button" data-tab="subscriptions">Subscriptions</button>
    <button class="tab" type="button" data-tab="audit">Audit</button>
  </nav>

  <main class="workspace">
    <div id="global-error" class="notice notice-error" hidden></div>

    <section id="tab-command" class="tab-panel is-active" data-panel="command">
      <div id="overview-cards" class="metric-grid"></div>
      <div class="grid-two">
        <section class="panel">
          <div class="panel-heading">
            <h2>Needs Attention</h2>
          </div>
          <div id="attention-list" class="stack"></div>
        </section>
        <section class="panel">
          <div class="panel-heading">
            <h2>Call Volume</h2>
          </div>
          <div id="call-stat-cards" class="metric-grid compact"></div>
        </section>
      </div>
    </section>

    <section id="tab-contractors" class="tab-panel" data-panel="contractors">
      <div class="toolbar">
        <input id="contractor-query" type="search" placeholder="Search contractors">
        <select id="contractor-status">
          <option value="">All statuses</option>
          <option value="trial">Trial</option>
          <option value="active">Active</option>
          <option value="expired">Expired</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select id="contractor-tier">
          <option value="">All tiers</option>
          <option value="personal">Personal</option>
          <option value="business">Business</option>
          <option value="businessPro">Business Pro</option>
          <option value="none">None</option>
        </select>
        <select id="contractor-has-twilio">
          <option value="">Any number</option>
          <option value="true">Has number</option>
          <option value="false">Missing number</option>
        </select>
      </div>
      <div id="contractors-table" class="table-wrap"></div>
      <section id="contractor-detail" class="panel detail-panel" hidden></section>
    </section>

    <section id="tab-calls" class="tab-panel" data-panel="calls">
      <div id="calls-table" class="table-wrap"></div>
    </section>

    <section id="tab-numbers" class="tab-panel" data-panel="numbers">
      <div id="numbers-summary" class="metric-grid compact"></div>
      <div id="numbers-table" class="table-wrap"></div>
    </section>

    <section id="tab-subscriptions" class="tab-panel" data-panel="subscriptions">
      <div id="subscriptions-table" class="table-wrap"></div>
    </section>

    <section id="tab-audit" class="tab-panel" data-panel="audit">
      <div id="audit-table" class="table-wrap"></div>
    </section>
  </main>

  <div id="action-modal" class="modal-backdrop" hidden>
    <form id="action-form" class="modal">
      <div class="modal-heading">
        <h2 id="action-title">Admin Action</h2>
        <button id="action-close" class="icon-button" type="button" aria-label="Close">x</button>
      </div>
      <div id="action-before" class="before-state"></div>
      <label for="action-reason">Reason</label>
      <textarea id="action-reason" rows="4" maxlength="500"></textarea>
      <div id="action-confirm-row" class="confirm-row" hidden>
        <label for="action-confirm">Type contractor ID</label>
        <input id="action-confirm" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button id="action-submit" class="button button-danger" type="submit" disabled>Confirm</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/admin.js"></script>
</body>
</html>
